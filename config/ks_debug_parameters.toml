# Keller-Segel Problem Configuration
# Based on KS_traveling_wave_double_arc.py parameters

[problem]
name = "KS_Traveling_Wave_Problem"
neq = 2
problem_type = "ks"

[time_parameters]
T = 1.0   # Final time (from KS_traveling_wave)
dt = 1.0 # Time step (from KS_traveling_wave)

[physical_parameters.diffusion]
nu = 1.0      # Cell diffusion coefficient (from KS_traveling_wave parameters array)
mu = 1.0      # Chemical diffusion coefficient (from KS_traveling_wave parameters array)

[physical_parameters.reaction]
a = 1.0       # Reaction parameter a (from KS_traveling_wave parameters array)
b = 0.0       # Reaction parameter b (from KS_traveling_wave parameters array)

[physical_parameters.chemotaxis]
chi = "constant"        # = "constant"     # Function name, not numeric value
dchi = "zeros"       # Function name for derivative of chi

[discretization]
n_elements = 1  # From KS_traveling_wave n_elements array
tau = [1.0, 1.0] # Stabilization parameters for u and v (from set_tau call)

[initial_conditions]
u = "s"     # Use traveling wave solution for initial u
phi = "s"   # Use traveling wave solution for initial v

# Exact solutions for error computation
[exact_solutions]
u = "s"     # Use traveling wave solution for initial u
phi = "s"   # Use traveling wave solution for initial v

[exact_solution_derivatives]
u_x = "constant" # Space derivative of traveling wave solution for u
phi_x = "constant" # Space derivative of traveling wave solution for v

[force_functions]
u_f = "constant"      # f = u_t - nu (u_xx - chi * (u * phi_x)_x)
phi_f = "s"      # Zero force for v (from KS_traveling_wave)

# Domain-specific overrides for initial conditions
[domain_initial_conditions]
# Use exact soluions from KS_traveling_wave by default
# domain_0_u = "traveling_wave_u"  # Example override
# domain_0_phi = "traveling_wave_phi"  # Example override

# Domain-specific overrides for force functions
[domain_force_functions]
# No domain-specific forces by default
# domain_1_phi = "attraction_source"  # Example override

